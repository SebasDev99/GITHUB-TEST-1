<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Registro</h1>
    <form>
        <div>
            <label for="fullname">Nombre Completo:</label>
            <input 
                type="text"
                maxlength="10"
                minlength="3"
                id="fullname"
                name="fullname"
                placeholder="Nombre completo"
                required
                />
        </div>

        <div>
            <label for="mail">Email:</label>
            <input 
            type="email"
            id="mail"
            required
            name="Email"
            placeholder="ejemplo@hotmail.com"
            >
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input 
            type="password"
            id="password"
            name="password"
            required
            placeholder="Contraseña"
            maxlength="20"
            minlength="12"
            >
        </div>
        <div>
            <span>Seleccione su lenguaje favorito:</span>
        </div>

        <div>
            <label for="html">HTML</label>
            <input 
            type="radio"
            name="lenguaje_favorito"
            id="html"            
            >

        </div>

        <div>
            <label for="css">CSS</label>
            <input 
            type="radio"
            name="lenguaje_favorito"
            id="css"
            >

        </div>

        <div>
            <label for="js">JS</label>
            <input type="radio" name="lenguaje_favorito" id="js">
        </div>

        <div>
            <span>Seleccione los lenguajes que conozca:</span>
        </div>

        <div>
            <label for="know_html">HTML</label>
            <input 
            type="checkbox"
            id="know_html"
            name="lenguaje_conocido">
        </div>

        <div>
            <label for="know_css">CSS</label>
            <input type="checkbox" name="lenguaje_conocido" id="know_css">
        </div>

        <div>
            <label for="know_js">JS</label>
            <input type="checkbox" name="lenguaje_conocido" id="know_js">
        </div>

        <div>
            <span>Seleccione su pais de origen:</span>
        </div>

        <div>
            <label for="pais">Elige tu pais de origen:</label>
            <select name="pais" id="pais">
            <option value="AR">Argentina</option>
            <option value="BR">Brasil</option>
            <option value="CO">Colombia</option>
            <option value="PAR">Paraguay</option>
            <option value="PE">Peru</option>
            </select>
        </div>

        <div>
            <label for="comentario">Dejanos un comentario</label>
            <textarea 
            name="comentario" 
            id="comentario"
            placeholder="Hola, estoy en html"
            rows="10"
            cols="3"
            maxlength="30"
            ></textarea>

        </div>
        
          <button type="submit">Registrarse</button>

    </form>
    
</body>
</html>
